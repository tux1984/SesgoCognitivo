# Los 5 medios del corpus. `nombre` debe coincidir EXACTO (con tildes) con la lista del
# dropdown de la columna C ("medio") en la hoja "Corpus - oraciones".
#
# `feeds`: URLs de RSS ya verificadas en vivo (HTTP 200) al momento de escribir este archivo.
#   Si dejan de responder, `descubrir=true` intenta redescubrirlas automáticamente antes de
#   caer al archivo de curación manual en data/corpus/manual_urls/<manual_fallback>.txt.
# `aviso_legal`: nota de gobernanza de datos, se imprime como advertencia en cada corrida.
medios:
  - id: infobae
    nombre: "Infobae Colombia"
    home: "https://www.infobae.com/colombia/"
    descubrir: true
    feeds:
      dura: "https://www.infobae.com/arc/outboundfeeds/rss/category/colombia/"
      # OJO: Infobae NO tiene una sección/feed de opinión propia de Colombia -- se
      # confirmó en vivo que .../category/opinion/ es el feed de opinión GLOBAL de
      # Infobae, dominado por autores y temas argentinos (Milei, Malvinas, economía
      # argentina). Se usó por error en una corrida real y contaminó 18 oraciones del
      # corpus con contenido no colombiano (columnas 5-6 sept 2026); se detectaron y
      # se borraron. NO reactivar sin verificar de nuevo que el contenido sea de
      # Colombia -- por ahora el sub-objetivo de opinión de Infobae queda sin cubrir
      # por RSS automático (ver README/aviso al tutor).
      opinion: null
    opinion_no_disponible: true
    manual_fallback: "infobae"
    aviso_legal: >
      Sin sección de opinión propia para Colombia (confirmado sobre las 100 columnas del
      feed global: solo 3 mencionan Colombia, ninguna coincide con nuestros 5 temas) -- el
      sub-objetivo de opinión no se puede llenar vía RSS sin mezclar contenido de otros
      países de habla hispana. Decisión 2026-09-05: se redistribuyó el objetivo íntegro a
      su propia noticia dura (14->20 por tema, opinión 6->0 en 'Grid de recoleccion'),
      coherente con su rol documentado de "Volumen de noticia dura" -- no se movió a otro
      medio, para preservar el total de 20 oraciones/celda en todo el grid.

  - id: eltiempo
    nombre: "El Tiempo"
    home: "https://www.eltiempo.com/"
    descubrir: true
    feeds:
      dura: "https://www.eltiempo.com/rss/politica.xml"
      opinion: "https://www.eltiempo.com/rss/opinion.xml"
    manual_fallback: "eltiempo"
    aviso_legal: >
      Aviso de copyright de El Tiempo prohíbe explícitamente el uso de su contenido para IA/ML;
      pendiente de resolución legal con la universidad. Se incluye igual por decisión deliberada
      (ver README.md) mientras se resuelve esa conversación.
    # Secciones adicionales del mismo CMS (no son "dura"/"opinión" separadas, se infiere
    # género por artículo) -- amplían cobertura temática más allá de /rss/politica.xml.
    feeds_adicionales:
      - "https://www.eltiempo.com/rss/mundo.xml"
      - "https://www.eltiempo.com/rss/justicia.xml"
      - "https://www.eltiempo.com/rss/economia.xml"
      - "https://www.eltiempo.com/rss/colombia.xml"
    # El RSS de opinión (/rss/opinion.xml) está dominado por caricaturas (10 items, la
    # mayoría viñetas cortas). Su página /opinion/ enlaza 70+ columnas de texto reales que
    # el RSS nunca expone -- se rastrea la página en su lugar.
    paginas_adicionales:
      - url: "https://www.eltiempo.com/opinion"
        incluir: ["/opinion/columnistas/", "/opinion/editorial/"]
        excluir: ["/opinion/caricaturas/"]

  - id: elespectador
    nombre: "El Espectador"
    home: "https://www.elespectador.com/"
    descubrir: true
    feeds:
      dura: "https://www.elespectador.com/arc/outboundfeeds/discover/category/politica/?outputType=xml"
      opinion: "https://www.elespectador.com/arc/outboundfeeds/discover/category/opinion/?outputType=xml"
    manual_fallback: "el_espectador"
    aviso_legal: >
      Riesgo de paywall "Premium" en su noticia dura -- mitigado con el filtro de largo
      mínimo por artículo (collector.MIN_CUERPO_ARTICULO): en una muestra de 8 artículos de
      la categoría política, 6 bajaron completos (2200-5900 chars) y 2 vacíos/truncados (0
      y 549 chars, descartados por el filtro). Se reactivó su noticia dura con esa
      protección puesta; revisar el log de "Descartado por cuerpo sospechosamente corto"
      si el porcentaje de descarte resulta mucho más alto que en esta muestra inicial.
    solo_opinion: false
    # Sub-secciones de Opinión más angostas que la categoría general -- todas sus URLs
    # contienen "/opinion/" (confirmado en vivo), así que la inferencia de género las
    # etiqueta bien igual sin arriesgar meter noticia dura de este medio.
    feeds_adicionales:
      - "https://www.elespectador.com/arc/outboundfeeds/discover/category/opinion/columnistas/?outputType=xml"
      - "https://www.elespectador.com/arc/outboundfeeds/discover/category/opinion/editorial/?outputType=xml"
      # Categorías de noticia dura adicionales -- antes evitadas por riesgo de paywall
      # "Premium"; ahora protegidas por el filtro de largo mínimo por artículo
      # (collector.MIN_CUERPO_ARTICULO), que ya demostró descartar correctamente el
      # contenido truncado en la categoría "politica".
      - "https://www.elespectador.com/arc/outboundfeeds/discover/category/economia/?outputType=xml"
      - "https://www.elespectador.com/arc/outboundfeeds/discover/category/judicial/?outputType=xml"
      - "https://www.elespectador.com/arc/outboundfeeds/discover/category/colombia-20/?outputType=xml"

  - id: lasillavacia
    nombre: "La Silla Vacía"
    home: "https://lasillavacia.com/"
    descubrir: true
    feeds:
      dura: "https://lasillavacia.com/feed/"
      opinion: "https://lasillavacia.com/feed/"
    manual_fallback: "la_silla_vacia"
    aviso_legal: >
      Verificar que el contenido no sea exclusivo para "SuperAmigos" antes de asumir acceso
      100% abierto.
    # Feeds de tag de WordPress -- mapean casi 1:1 a nuestros 5 temas y confirmados en vivo
    # con contenido relevante (a diferencia del feed general, que mezcla de todo).
    feeds_adicionales:
      - "https://lasillavacia.com/tag/terremoto-en-colombia-2026/feed/"
      - "https://lasillavacia.com/tag/reforma-pensional/feed/"
      - "https://lasillavacia.com/tag/reforma-tributaria/feed/"
      - "https://lasillavacia.com/tag/seguridad/feed/"
      - "https://lasillavacia.com/tag/grupos-armados/feed/"
      - "https://lasillavacia.com/tag/estados-unidos/feed/"
      - "https://lasillavacia.com/tag/aranceles/feed/"

  - id: semana
    nombre: "Semana"
    home: "https://www.semana.com/"
    descubrir: true
    feeds:
      dura: "https://www.semana.com/arc/outboundfeeds/rss/"
      # Antes apuntaba al mismo feed genérico que "dura" (inferencia de género por URL
      # sobre un feed mezclado). Se encontró un feed de categoría "opinion" dedicado con
      # contenido bastante más alineado a nuestros 5 temas -- se usa ese en su lugar.
      opinion: "https://www.semana.com/arc/outboundfeeds/rss/category/opinion/"
    manual_fallback: "semana"
    aviso_legal: >
      Sin RSS oficialmente documentado por el medio; se usa el feed genérico de Arc XP para
      dura, y su categoría "opinion" dedicada para opinión. Género también se infiere por
      segmento de URL como red de seguridad, ya que ninguno de los dos feeds es 100% puro.
    feeds_adicionales:
      - "https://www.semana.com/arc/outboundfeeds/rss/category/economia/"
      - "https://www.semana.com/arc/outboundfeeds/rss/category/mundo/"
      - "https://www.semana.com/arc/outboundfeeds/rss/category/nacion/"
