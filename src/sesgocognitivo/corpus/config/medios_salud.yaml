# Medios para el dominio "Salud" del corpus v2 -- ángulo: crisis de las EPS / reforma a
# la salud (ver temas.yaml). Los feeds de sección "salud" existen y validan, pero
# muchas de las historias específicas de la crisis EPS son de meses atrás (no salen en
# los últimos ítems del RSS) -- se complementan fuerte con curación manual verificada.
medios:
  - id: infobae
    nombre: "Infobae Colombia"
    aviso_legal: >
      Sin sección de opinión propia para Colombia: se confirmó en vivo que su feed de
      opinión es el GLOBAL de Infobae, dominado por autores y temas argentinos. Por eso
      va marcado con opinion_no_disponible y su cuota se atiende 100% con noticia dura.
    home: "https://www.infobae.com/colombia/"
    descubrir: false
    feeds:
      dura: "https://www.infobae.com/arc/outboundfeeds/rss/category/colombia/"
      opinion: null
    opinion_no_disponible: true
    manual_fallback: "infobae_salud"

  - id: eltiempo
    nombre: "El Tiempo"
    aviso_legal: >
      Aviso de copyright de El Tiempo prohíbe explícitamente el uso de su contenido para
      IA/ML; pendiente de resolución legal con la universidad. Se incluye igual por
      decisión deliberada (ver README.md) mientras se resuelve esa conversación.
    home: "https://www.eltiempo.com/"
    descubrir: false
    feeds:
      dura: "https://www.eltiempo.com/rss/salud.xml"
      opinion: null
    manual_fallback: "eltiempo_salud"
    paginas_adicionales:
      - url: "https://www.eltiempo.com/opinion"
        incluir: ["/opinion/columnistas/", "/opinion/editorial/"]
        excluir: ["/opinion/caricaturas/"]

  - id: elespectador
    nombre: "El Espectador"
    aviso_legal: >
      Riesgo de paywall "Premium", sobre todo en columnas de opinión: se mitiga con el
      filtro de largo mínimo por artículo (collector.MIN_CUERPO_ARTICULO). Revisar en el
      log los "Descartado por cuerpo sospechosamente corto" si el descarte sube mucho.
    home: "https://www.elespectador.com/"
    descubrir: false
    feeds:
      dura: "https://www.elespectador.com/arc/outboundfeeds/discover/category/salud/?outputType=xml"
      opinion: "https://www.elespectador.com/arc/outboundfeeds/discover/category/opinion/?outputType=xml"
    manual_fallback: "elespectador_salud"

  - id: lasillavacia
    nombre: "La Silla Vacía"
    aviso_legal: >
      Verificar que el contenido no sea exclusivo para "SuperAmigos" antes de asumir
      acceso 100% abierto.
    home: "https://lasillavacia.com/"
    descubrir: false
    feeds:
      dura: "https://lasillavacia.com/tag/salud/feed/"
      opinion: "https://lasillavacia.com/tag/salud/feed/"
    manual_fallback: "lasillavacia_salud"

  - id: semana
    nombre: "Semana"
    aviso_legal: >
      Sin RSS oficialmente documentado por el medio; se usa el feed genérico de Arc XP.
      El género se infiere además por segmento de URL como red de seguridad, ya que
      ninguno de los feeds es 100% puro.
    home: "https://www.semana.com/"
    descubrir: false
    feeds:
      dura: "https://www.semana.com/arc/outboundfeeds/rss/category/salud/"
      opinion: "https://www.semana.com/arc/outboundfeeds/rss/category/opinion/"
    manual_fallback: "semana_salud"
